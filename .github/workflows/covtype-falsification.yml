name: Covertype falsification

on:
  push:
    branches: [falsification-covtype]
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python covtype_falsification.py
      - uses: actions/upload-artifact@v4
        with:
          name: covtype-falsification-results
          path: results/covtype_falsification*
